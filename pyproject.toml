[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novelis"
version = "0.1.0"
description = "Novelis: Fiction Operating System (FOS) Core Engine"
authors = [{ name = "Novelis Team" }]
readme = "docs/NSPEC-000.md"
requires-python = ">=3.10"
dependencies = [
    "lancedb>=0.6.0",
    "pyarrow>=14.0.0",
    "fastembed>=0.3.0",
    "google-generativeai>=0.7.0",
    "openai>=1.20.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
novelis = "novelis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
